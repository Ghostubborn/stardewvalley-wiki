# Cloudflare Pages publishes the generated static website (prototype/) and the Functions in functions/.
name = "stardewvalley-wiki"
pages_build_output_dir = "./prototype"
compatibility_date = "2026-10-26"

# 访客反馈（functions/api/feedback/）读写的 D1 数据库（2026-10-29 创建，区域 WNAM）。
# 建表：wrangler d1 migrations apply stardewvalley-wiki-feedback --remote（见 docs/cloudflare-pages.md）。
[[d1_databases]]
binding = "FEEDBACK_DB"
database_name = "stardewvalley-wiki-feedback"
database_id = "133cfadd-413b-42c9-8c29-cb77891a7986"
